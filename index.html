<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logonebula.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Envelope</title>
  </head>
  <body>
    <!-- PRELOADER -->
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #app-preloader::before {
        content: '';
        position: absolute;
        width: 150vw;
        height: 150vw;
        background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(0,0,0,0) 70%);
        animation: pulseBg 8s ease-in-out infinite alternate;
      }
      .preloader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .glass-card {
        padding: 3rem;
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .loader-rings {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ring {
        position: absolute;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .ring:nth-child(1) {
        width: 100%;
        height: 100%;
        border-top-color: #38bdf8;
        border-right-color: #818cf8;
        animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }
      .ring:nth-child(2) {
        width: 75%;
        height: 75%;
        border-bottom-color: #c084fc;
        border-left-color: #38bdf8;
        animation: spinReverse 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }
      .ring:nth-child(3) {
        width: 50%;
        height: 50%;
        border-top-color: #818cf8;
        border-bottom-color: #c084fc;
        animation: spin 2.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }
      .brand-text {
        margin-top: 1.5rem;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: linear-gradient(to right, #38bdf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: pulseText 2s ease-in-out infinite alternate;
      }
      .subtitle-text {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
        margin-top: 0.5rem;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseBg {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 0.8; }
      }
      @keyframes slideUpFade {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseText {
        0% { opacity: 0.8; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3)); }
        100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.6)); }
      }
    </style>
    <div id="app-preloader">
      <div class="preloader-content">
        <div class="glass-card">
          <div class="loader-rings">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
          </div>
          <div class="brand-text">Sistem Surat</div>
          <div class="subtitle-text">Memuat Ruang Kerja</div>
        </div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
